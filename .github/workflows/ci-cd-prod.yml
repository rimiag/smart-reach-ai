# =============================================================================
# SmartReach AI - Deploy to PRODUCTION (manual, gated)
# =============================================================================
# Production = the existing AWS EC2 that also hosts your website
# (reachpulse.medidatalab.com + api.medidatalab.com behind its nginx). BOTH
# pipelines are manual and branch-pinned: this one ALWAYS builds and deploys
# the head of MAIN (staging's ci-cd.yml is pinned to the staging branch the
# same way). Pushing to any branch never deploys anything.
#
# What runs:
#   1. build backend image  -> ghcr.io/rimiag/smart-reach-ai-backend:prod-<sha7>
#   2. build frontend image -> ...-frontend:prod-<sha7>  (rebuilt with the
#      production NEXT_PUBLIC_API_URL from the "production" GitHub Environment
#      - NEXT_PUBLIC_* is baked into the JS bundle at BUILD time)
#   3. deploy on the prod EC2 via its self-hosted runner (label: prod)
#
# One-time setup (DEPLOYMENT.md): EC2 runner + /opt/smart-reach-ai-prod/
# .prod.env + the GitHub Environment "production" holding the
# NEXT_PUBLIC_API_URL variable (environment variables override repo variables
# for jobs that declare the environment - staging keeps its repo variable).
#
# Rollback: Run workflow with image_tag = prod-<older-sha7>.
# =============================================================================

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy. Leave EMPTY to build+deploy this commit (prod-<sha7>); for rollback enter an existing tag, e.g. prod-ab12cd3"
        required: false
        default: ""

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # Single source of truth for the image tag: the head of MAIN at the moment
  # the run starts. Build and deploy jobs reuse this output, so they can never
  # disagree about what was built vs deployed.
  resolve:
    name: Resolve main head
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Short sha of main head
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build backend image (prod)
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/rimiag/smart-reach-ai-backend:prod-${{ needs.resolve.outputs.short }}
            ghcr.io/rimiag/smart-reach-ai-backend:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend image (prod)
    needs: resolve
    # Declaring the environment makes the env-scoped NEXT_PUBLIC_API_URL
    # variable visible here (it overrides the repo variable of the same name).
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # Fail with a clear message instead of silently baking an empty/wrong
      # API URL into the prod frontend bundle.
      - name: Check production NEXT_PUBLIC_API_URL is configured
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::error::NEXT_PUBLIC_API_URL is not set on the 'production' GitHub Environment."
            echo "Fix: repo Settings > Environments > production > Add variable"
            echo "     Name: NEXT_PUBLIC_API_URL   Value: https://api.medidatalab.com"
            exit 1
          fi
          echo "Baking NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/rimiag/smart-reach-ai-frontend:prod-${{ needs.resolve.outputs.short }}
            ghcr.io/rimiag/smart-reach-ai-frontend:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

  deploy-prod:
    name: Deploy to prod EC2
    needs: [resolve, build-backend, build-frontend]
    environment: production
    runs-on: [self-hosted, prod]
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # Resolve the tag once: the workflow input (rollback) or this commit's
      # prod-<sha7>. Exported via GITHUB_ENV so every later step sees it.
      - name: Resolve image tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_ENV"
            echo "Rolling back to existing tag ${{ inputs.image_tag }}"
          else
            echo "IMAGE_TAG=prod-${{ needs.resolve.outputs.short }}" >> "$GITHUB_ENV"
            echo "Deploying prod-${{ needs.resolve.outputs.short }} (head of main)"
          fi

      - name: Prepare .prod.env
        run: |
          if [ ! -f /opt/smart-reach-ai-prod/.prod.env ]; then
            echo "::error::/opt/smart-reach-ai-prod/.prod.env is missing - create it from .prod.env.example (see DEPLOYMENT.md)"
            exit 1
          fi
          cp /opt/smart-reach-ai-prod/.prod.env ./.prod.env

      # Every compose call below MUST pass -f docker-compose.prod.yml: the
      # checkout also contains docker-compose.yml (staging) and compose would
      # happily use it.
      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -n "$GHCR_PAT" ]; then
            echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          else
            echo "GHCR_PAT not set - relying on 'docker login ghcr.io' done during EC2 bootstrap"
          fi

      - name: Pull and restart services
        run: |
          set -a; . ./.prod.env; set +a
          export IMAGE_TAG
          echo "Deploying $IMAGE_TAG to prod EC2"
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      # Same rationale as staging: a failed healthcheck inside `up -d` would
      # otherwise leave the crash reason only on the VM.
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          export IMAGE_TAG
          echo "=== compose ps (all) ==="
          docker compose -f docker-compose.prod.yml ps -a || true
          echo "=== backend logs (last 150 lines) ==="
          docker logs --tail 150 smart-reach-ai-prod-backend-1 2>&1 || true
          echo "=== backend health state ==="
          docker inspect --format '{{json .State.Health}}' smart-reach-ai-prod-backend-1 2>/dev/null | head -c 3000 || true
          echo ""
          echo "=== db logs (last 40 lines) ==="
          docker logs --tail 40 smart-reach-ai-prod-db-1 2>&1 || true
          echo "=== EC2 resources ==="
          free -h || true
          df -h / || true
          docker stats --no-stream || true

      - name: Wait for services to be healthy
        run: |
          check_url () {
            local name=$1 url=$2 tries=30
            for i in $(seq 1 "$tries"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)
              case "$code" in
                200|301|302|307) echo "[OK] $name is up (HTTP $code)"; return 0 ;;
              esac
              echo "[$name] attempt $i/$tries -> HTTP ${code:-none}, waiting..."
              sleep 10
            done
            echo "::error::$name did not become healthy at $url"
            return 1
          }
          check_url backend  http://localhost:8000/health
          check_url frontend http://localhost:3000
          docker compose -f docker-compose.prod.yml ps
