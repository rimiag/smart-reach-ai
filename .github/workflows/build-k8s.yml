# =============================================================================
# SmartReach AI - Build K8S IMAGES (manual; GitOps deploys them)
# =============================================================================
# Builds the images that ARGOCD deploys to the Kubernetes staging cluster
# (minikube on 192.168.1.30 - see infra/k8s/GITOPS.md). There is NO deploy
# job here - that is the point of the pull-based flow:
#
#   1. Run this workflow            -> GHCR gets ...:k8s-sha-<sha7>
#   2. Edit the two newTag lines in
#      infra/k8s/overlays/staging/kustomization.yaml to that tag
#   3. Commit + push the staging branch
#   4. Argo CD notices and syncs the cluster (deploy = pull, no runner SSH)
#
# Tags are k8s-sha-<short-of-staging-head> (immutable), so old tags remain
# in GHCR and a rollback is a git revert of step 2-3.
#
# The compose-staging flow is a SEPARATE workflow (ci-cd.yml, tags sha-*).
# The tag prefixes never overlap, so neither flow can deploy the other's
# images. Prod (ci-cd-prod.yml, prod-* tags) likewise untouched.
#
# Frontend: NEXT_PUBLIC_API_URL is baked into the JS bundle at BUILD time.
# K8s staging serves the API on NodePort 30081 on the VM IP, so the default
# here is http://192.168.1.30:30081. Override with the repo variable
# K8S_NEXT_PUBLIC_API_URL if the VM address ever changes.
# =============================================================================

name: Build K8s Images

on:
  workflow_dispatch:

concurrency:
  group: build-k8s
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve staging head
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
      - name: Short sha of staging head
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build backend image
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/rimiag/smart-reach-ai-backend:k8s-sha-${{ needs.resolve.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend image
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* is baked at build time - the K8S NodePort URL, NOT the
      # compose-staging :8000 one (repo variable K8S_NEXT_PUBLIC_API_URL
      # overrides the default).
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/rimiag/smart-reach-ai-frontend:k8s-sha-${{ needs.resolve.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.K8S_NEXT_PUBLIC_API_URL || 'http://192.168.1.30:30081' }}
