# =============================================================================
# SmartReach AI - CI/CD Pipeline
# =============================================================================
# Flow:
#   PR -> backend/frontend quality checks
#   push to main -> quality checks -> build & push images to GHCR
#                -> deploy to staging (self-hosted runner on the staging VM)
#
# Images are tagged with the commit SHA (immutable) + `latest`.
# Rollback = re-run a previous "Deploy to staging" job, or manually:
#   export IMAGE_TAG=sha-<old-sha> && docker compose up -d
# =============================================================================

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Quality gates - run on every PR and every push to main
  # ---------------------------------------------------------------------------
  backend-checks:
    name: Backend / lint + smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check formatting (black)
        run: black --check app

      - name: Check import order (isort)
        run: isort --check-only app

      - name: Smoke test - app imports cleanly
        run: python -c "from app.main import app; print('backend import OK')"

  frontend-checks:
    name: Frontend / type check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run type-check

      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Build & publish images - only on successful pushes to main
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build & push backend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase repo name for GHCR
        id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}-backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy (report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: table

  build-frontend:
    name: Build & push frontend image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase repo name for GHCR
        id: repo
        run: echo "lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Warn if NEXT_PUBLIC_API_URL is not configured
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::warning::Repository variable NEXT_PUBLIC_API_URL is not set. Falling back to http://localhost:8000. Client-side API calls will only work when browsing from the server itself. Set it in Settings > Secrets and variables > Actions > Variables."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}-frontend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # NOTE: NEXT_PUBLIC_* vars are baked into the JS bundle at BUILD time.
      # If you change NEXT_PUBLIC_API_URL you must rebuild the frontend image.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}

      - name: Scan image with Trivy (report only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.repo.outputs.lower }}-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: table

  # ---------------------------------------------------------------------------
  # Deploy - runs ON the staging VM via self-hosted runner (outbound-only,
  # no SSH exposure needed). Requires one-time setup per CICD_SETUP.md.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to staging VM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-backend, build-frontend]
    runs-on: [self-hosted, staging]
    environment: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve deploy tag
        id: tag
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Prepare staging env file
        run: |
          if [ ! -f /opt/smart-reach-ai-staging/.staging.env ]; then
            echo "::error::/opt/smart-reach-ai-staging/.staging.env is missing. Create it from .staging.env.example (see CICD_SETUP.md)."
            exit 1
          fi
          sudo cp /opt/smart-reach-ai-staging/.staging.env ./.staging.env

      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -n "$GHCR_PAT" ]; then
            echo "$GHCR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          else
            echo "GHCR_PAT not set - assuming 'docker login ghcr.io' was done during bootstrap."
          fi

      - name: Pull and restart services
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          set -a
          . ./.staging.env
          set +a
          echo "Deploying IMAGE_TAG=$IMAGE_TAG"
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d --remove-orphans

      - name: Wait for services to be healthy
        run: |
          BACKEND_URL="${{ vars.STAGING_HEALTHCHECK_BACKEND || 'http://localhost:8000' }}"
          FRONTEND_URL="${{ vars.STAGING_HEALTHCHECK_FRONTEND || 'http://localhost:3000' }}"

          check_url () {
            local name=$1 url=$2 tries=30
            for i in $(seq 1 "$tries"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)
              case "$code" in
                200|301|302|307) echo "[OK] $name responded with HTTP $code"; return 0 ;;
              esac
              echo "[$name] attempt $i/$tries -> HTTP ${code:-none}, waiting..."
              sleep 10
            done
            echo "::error::$name did not become healthy at $url"
            return 1
          }

          check_url backend  "$BACKEND_URL/health"
          check_url frontend "$FRONTEND_URL"
          docker compose -f docker-compose.yml ps

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "### Staging deployment - ${{ job.status }}"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Image tag | \`sha-${GITHUB_SHA::7}\` |"
            echo "| Actor | @${{ github.actor }} |"
          } >> "$GITHUB_STEP_SUMMARY"

# =============================================================================
# Optional hardening once comfortable:
#   - Settings > Environments > staging > Required reviewers => deploys wait
#     for your click (no code change needed).
#   - Branch protection on main: require the two "*checks" jobs to pass.
#   - Turn Trivy's continue-on-error:false to gate releases on CVEs.
# =============================================================================
