# =============================================================================
# SmartReach AI - Build & Deploy (the ONLY pipeline)
# =============================================================================
# One push to main:
#   1. build backend image  -> ghcr.io/rimiag/smart-reach-ai-backend
#   2. build frontend image -> ghcr.io/rimiag/smart-reach-ai-frontend
#   3. deploy on the staging VM (192.168.1.30) via its self-hosted runner
#
# Images are tagged sha-<short> (immutable) + latest, so the VM always runs
# exactly the commit that was pushed.
#   Rollback: Actions -> older green run -> "Re-run all jobs"
#   (or on the VM: export IMAGE_TAG=sha-<old7> && docker compose up -d)
#
# Deliberately minimal: no PR checks, no dependency bots, no scanners.
# =============================================================================

name: Build and Deploy

on:
  push:
    branches: [main]

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build-backend:
    name: Build backend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short sha
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/rimiag/smart-reach-ai-backend:sha-${{ steps.vars.outputs.short }}
            ghcr.io/rimiag/smart-reach-ai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short sha
        id: vars
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* is baked into the JS bundle at BUILD time. Set the repo
      # variable NEXT_PUBLIC_API_URL to change it (falls back to the VM IP).
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/rimiag/smart-reach-ai-frontend:sha-${{ steps.vars.outputs.short }}
            ghcr.io/rimiag/smart-reach-ai-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://192.168.1.30:8000' }}

  deploy:
    name: Deploy to staging VM (192.168.1.30)
    needs: [build-backend, build-frontend]
    runs-on: [self-hosted, staging]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare .staging.env
        run: |
          if [ ! -f /opt/smart-reach-ai-staging/.staging.env ]; then
            echo "::error::/opt/smart-reach-ai-staging/.staging.env is missing - create it from .staging.env.example (see CICD_SETUP.md)"
            exit 1
          fi
          cp /opt/smart-reach-ai-staging/.staging.env ./.staging.env

      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -n "$GHCR_PAT" ]; then
            echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          else
            echo "GHCR_PAT not set - relying on 'docker login ghcr.io' done during VM bootstrap"
          fi

      - name: Pull and restart services
        run: |
          set -a; . ./.staging.env; set +a
          export IMAGE_TAG=sha-${GITHUB_SHA::7}
          echo "Deploying $IMAGE_TAG to staging VM"
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d --remove-orphans

      - name: Wait for services to be healthy
        run: |
          check_url () {
            local name=$1 url=$2 tries=30
            for i in $(seq 1 "$tries"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)
              case "$code" in
                200|301|302|307) echo "[OK] $name is up (HTTP $code)"; return 0 ;;
              esac
              echo "[$name] attempt $i/$tries -> HTTP ${code:-none}, waiting..."
              sleep 10
            done
            echo "::error::$name did not become healthy at $url"
            return 1
          }
          check_url backend  http://localhost:8000/health
          check_url frontend http://localhost:3000
          docker compose -f docker-compose.yml ps
