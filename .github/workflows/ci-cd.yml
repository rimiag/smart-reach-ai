# =============================================================================
# SmartReach AI - Build & Deploy STAGING (manual, branch-pinned)
# =============================================================================
# MANUAL deploy: GitHub Actions -> "Build and Deploy" -> Run workflow.
# A run ALWAYS builds and deploys the head of the STAGING branch, no matter
# which branch is picked in the dialog. Pushing code (to any branch) NEVER
# deploys anything. Prod has its own manual workflow (ci-cd-prod.yml) pinned
# to main the same way.
#
# Branch model: work lands on "staging" -> run this workflow -> test on the
# staging VM -> merge "staging" into "main" -> run "Deploy to Production".
#
# What a run does:
#   1. build backend image  -> ghcr.io/rimiag/smart-reach-ai-backend
#   2. build frontend image -> ghcr.io/rimiag/smart-reach-ai-frontend
#   3. deploy on the staging VM (192.168.1.30) via its self-hosted runner
#
# Images are tagged sha-<short-of-staging-head> (immutable) + latest, so the
# VM always runs exactly the staging-branch commit that was built.
#   Rollback: Actions -> older green run -> "Re-run all jobs"
#   (or on the VM: export IMAGE_TAG=sha-<old7> && docker compose up -d)
#
# Deliberately minimal: no PR checks, no dependency bots, no scanners.
# =============================================================================

name: Build and Deploy

on:
  # Manual only (Actions tab -> Build and Deploy -> Run workflow). A push to
  # any branch does NOT deploy. Covers normal releases as well as ops moves
  # like changing the NEXT_PUBLIC_API_URL variable or a RESET_STAGING_DB reset.
  workflow_dispatch:

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  # Single source of truth for the image tag: the head of the staging branch
  # at the moment the run starts. Build and deploy jobs reuse this output, so
  # they can never disagree about what was built vs deployed.
  resolve:
    name: Resolve staging head
    runs-on: ubuntu-latest
    outputs:
      short: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
      - name: Short sha of staging head
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build backend image
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/rimiag/smart-reach-ai-backend:sha-${{ needs.resolve.outputs.short }}
            ghcr.io/rimiag/smart-reach-ai-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build frontend image
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* is baked into the JS bundle at BUILD time. Set the repo
      # variable NEXT_PUBLIC_API_URL to change it (falls back to the VM IP).
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/rimiag/smart-reach-ai-frontend:sha-${{ needs.resolve.outputs.short }}
            ghcr.io/rimiag/smart-reach-ai-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://192.168.1.30:8000' }}

  deploy:
    name: Deploy to staging VM (192.168.1.30)
    needs: [resolve, build-backend, build-frontend]
    runs-on: [self-hosted, staging]
    env:
      IMAGE_TAG: sha-${{ needs.resolve.outputs.short }}
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Prepare .staging.env
        run: |
          if [ ! -f /opt/smart-reach-ai-staging/.staging.env ]; then
            echo "::error::/opt/smart-reach-ai-staging/.staging.env is missing - create it from .staging.env.example (see STAGING_DEPLOYMENT.md)"
            exit 1
          fi
          cp /opt/smart-reach-ai-staging/.staging.env ./.staging.env

      # Maintenance lever for staging: set the repo variable RESET_STAGING_DB=yes
      # (gh variable set RESET_STAGING_DB --body yes) and Run workflow from the
      # Actions tab to wipe the db volume so it re-initializes from the current
      # .staging.env + init.sql. Deletes all staging data -
      # keep it "no" otherwise. Reset to "no" after use. Full procedure:
      # STAGING_DEPLOYMENT.md, section "One-time staging DB reset".
      - name: Reset staging db volume (only when RESET_STAGING_DB=yes)
        if: vars.RESET_STAGING_DB == 'yes'
        run: |
          echo "RESET_STAGING_DB=yes - wiping db volume, it will re-init from .staging.env"
          docker compose -f docker-compose.yml stop db || true
          docker compose -f docker-compose.yml rm -f db || true
          # no-op error if the volume doesn't exist yet (first-ever deploy)
          docker volume rm smart-reach-ai-staging_mysql_data || true

      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: |
          if [ -n "$GHCR_PAT" ]; then
            echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          else
            echo "GHCR_PAT not set - relying on 'docker login ghcr.io' done during VM bootstrap"
          fi

      - name: Pull and restart services
        run: |
          set -a; . ./.staging.env; set +a
          echo "Deploying $IMAGE_TAG to staging VM"
          docker compose -f docker-compose.yml pull
          docker compose -f docker-compose.yml up -d --remove-orphans

      # The deploy fails inside `up -d` when the backend never passes its
      # healthcheck - without this step the actual crash reason stays on the
      # VM and every diagnosis needs a manual SSH session.
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== compose ps (all) ==="
          docker compose -f docker-compose.yml ps -a || true
          echo "=== backend logs (last 150 lines) ==="
          docker logs --tail 150 smart-reach-ai-staging-backend-1 2>&1 || true
          echo "=== backend health state ==="
          docker inspect --format '{{json .State.Health}}' smart-reach-ai-staging-backend-1 2>/dev/null | head -c 3000 || true
          echo ""
          echo "=== db logs (last 40 lines) ==="
          docker logs --tail 40 smart-reach-ai-staging-db-1 2>&1 || true
          echo "=== VM resources ==="
          free -h || true
          df -h / || true
          docker stats --no-stream || true

      - name: Wait for services to be healthy
        run: |
          check_url () {
            local name=$1 url=$2 tries=30
            for i in $(seq 1 "$tries"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)
              case "$code" in
                200|301|302|307) echo "[OK] $name is up (HTTP $code)"; return 0 ;;
              esac
              echo "[$name] attempt $i/$tries -> HTTP ${code:-none}, waiting..."
              sleep 10
            done
            echo "::error::$name did not become healthy at $url"
            return 1
          }
          check_url backend  http://localhost:8000/health
          check_url frontend http://localhost:3000
          docker compose -f docker-compose.yml ps
