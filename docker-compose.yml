version: '3.8'

services:
  # Frontend - Next.js (Development Mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://192.168.1.30:8000
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - leadgen-network
    restart: unless-stopped

  # Backend - FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Signal to skip local .env file
      - ENV_FILE=docker

      # Application
      - ENVIRONMENT=development
      - APP_NAME=AI Lead Generation Platform
      - API_URL=http://192.168.1.30:8000
      - FRONTEND_URL=http://192.168.1.30:3000

      # Security
      - SECRET_KEY=docker-dev-secret-key-change-in-production
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7

      # Database (Docker internal network)
      - DATABASE_URL=mariadb+aiomysql://leadgen_user:leadgen_pass@db:3306/leadgen_db
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=10
      - DB_POOL_TIMEOUT=30

      # Redis (Docker internal network)
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_TTL=3600

      # CORS
      - CORS_ORIGINS=http://frontend:3000,http://localhost:3000,http://192.168.1.30:3000,http://backend:8000,http://192.168.1.30:8000

      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

      # Logging
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - leadgen-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  # Celery Worker - Background tasks
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      # Application
      - ENVIRONMENT=development

      # Security
      - SECRET_KEY=docker-dev-secret-key-change-in-production

      # Database (Docker internal network)
      - DATABASE_URL=mariadb+aiomysql://leadgen_user:leadgen_pass@db:3306/leadgen_db

      # Redis (Docker internal network)
      - REDIS_URL=redis://redis:6379/0

      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

      # Logging
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - leadgen-network
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # Celery Beat - Scheduled tasks
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    environment:
      # Application
      - ENVIRONMENT=development

      # Security
      - SECRET_KEY=docker-dev-secret-key-change-in-production

      # Database (Docker internal network)
      - DATABASE_URL=mariadb+aiomysql://leadgen_user:leadgen_pass@db:3306/leadgen_db

      # Redis (Docker internal network)
      - REDIS_URL=redis://redis:6379/0

      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

      # Logging
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - /app/.venv
      - celerybeat-data:/tmp/celerybeat
    user: root
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - leadgen-network
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  # Flower - Celery monitoring (optional)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app flower --port=5555 --broker=redis://redis:6379/0
    ports:
      - "5555:5555"
    environment:
      # Application
      - ENVIRONMENT=development

      # Redis (Docker internal network)
      - REDIS_URL=redis://redis:6379/0

      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
      - worker
    networks:
      - leadgen-network
    restart: unless-stopped

  # MariaDB Database (compatible with version 10.1.x)
  db:
    image: mariadb:10.1.48
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password_change_in_production
      - MYSQL_DATABASE=leadgen_db
      - MYSQL_USER=leadgen_user
      - MYSQL_PASSWORD=leadgen_pass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - leadgen-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_change_in_production"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Redis - Celery broker and cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - leadgen-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  leadgen-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  celerybeat-data:
