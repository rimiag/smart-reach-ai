# =============================================================================
# SmartReach AI - Docker Compose (STAGING)
# =============================================================================
# This is the ONE deployment file: `docker-compose` == staging environment.
# (Laptop development runs natively - backend/.venv + frontend npm dev - it
# does not use this file.)
#
# Services run from images; CI/CD pins them to an exact commit via IMAGE_TAG
# (e.g. sha-ab12cd3), so what runs on staging is exactly what passed checks.
# All services also keep a `build:` section so a manual local build is still
# possible if you ever need one (`docker compose build && up -d`).
#
# Configuration:
#   ./.staging.env  -> required. Copy .staging.env.example and fill in real
#                      values. Injected into containers (env_file) AND sourced
#                      by deploys for ${...} interpolation below.
#
# Rollback: re-run an older "Deploy to staging VM" run in GitHub Actions,
# or manually with a checkout of that commit:
#   export IMAGE_TAG=sha-old1234 && docker compose up -d
# =============================================================================

name: smart-reach-ai-staging

x-backend-env: &backend-env
  ENV_FILE: docker
  ENVIRONMENT: staging
  DATABASE_URL: mariadb+aiomysql://${DB_USER:-leadgen_user}:${DB_PASSWORD:-leadgen_pass}@db:3306/${DB_NAME:-leadgen_db}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  API_URL: ${API_URL:-http://localhost:8000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}

services:
  frontend:
    image: ghcr.io/rimiag/smart-reach-ai-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://192.168.1.30:8000}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - leadgen-network
    restart: unless-stopped

  backend:
    image: ghcr.io/rimiag/smart-reach-ai-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./.staging.env
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - leadgen-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    restart: unless-stopped

  worker:
    image: ghcr.io/rimiag/smart-reach-ai-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 --queues=celery,search,crawl,ai,email
    env_file:
      - ./.staging.env
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - leadgen-network
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  scheduler:
    image: ghcr.io/rimiag/smart-reach-ai-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    env_file:
      - ./.staging.env
    environment:
      <<: *backend-env
    volumes:
      - celerybeat-data:/tmp/celerybeat
    user: root
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    networks:
      - leadgen-network
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  flower:
    image: ghcr.io/rimiag/smart-reach-ai-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app flower --port=5555 --broker=redis://redis:6379/0
    ports:
      - "5555:5555"
    environment:
      ENVIRONMENT: staging
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - redis
      - worker
    networks:
      - leadgen-network
    restart: unless-stopped

  # MariaDB 10.1 (matches the version your data was built against)
  db:
    image: mariadb:10.1.48
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_in_production}
      MYSQL_DATABASE: ${DB_NAME:-leadgen_db}
      MYSQL_USER: ${DB_USER:-leadgen_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-leadgen_pass}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - leadgen-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - leadgen-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  leadgen-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  celerybeat-data:
