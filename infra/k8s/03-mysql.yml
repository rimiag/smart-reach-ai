# SmartReach AI - MySQL 8 (same engine as prod; staging VM runs MariaDB 10.1).
# Credentials come from the "smartreach-env" Secret (MYSQL_* keys).
# WARNING: the volume password is baked in on FIRST boot - changing the
# secret later does NOT change it (delete the PVC to re-initialize; data
# on minikube is disposable).
# Health probes do a real login as the app user - "mysqladmin ping" once
# masked a credential drift on staging (DEPLOYMENT.md "Access denied 1045").
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: smartreach
  labels:
    app: smartreach
    component: mysql
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: smartreach
    component: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: smartreach
  labels:
    app: smartreach
    component: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: smartreach
      component: mysql
  template:
    metadata:
      labels:
        app: smartreach
        component: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
          envFrom:
            - secretRef:
                name: smartreach-env
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          # MySQL 8 initializes its data directory on first boot - give it time.
          startupProbe:
            exec:
              command: ["sh", "-c", "mysql -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\" -e 'SELECT 1' \"$MYSQL_DATABASE\""]
            periodSeconds: 5
            failureThreshold: 60   # up to 5 min on a fresh volume
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysql -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\" -e 'SELECT 1' \"$MYSQL_DATABASE\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysql -u\"$MYSQL_USER\" -p\"$MYSQL_PASSWORD\" -e 'SELECT 1' \"$MYSQL_DATABASE\""]
            periodSeconds: 30
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
