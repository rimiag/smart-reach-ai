# SmartReach AI - Celery worker (search, crawl, AI, email queues).
# Same backend image, worker command - exactly the docker-compose command.
# The initContainer mirrors compose's "depends_on: backend: healthy": it
# waits until the API has booted (DB migrated) so the worker never races
# table creation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: smartreach
  labels:
    app: smartreach
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartreach
      component: worker
  template:
    metadata:
      labels:
        app: smartreach
        component: worker
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-backend
          image: smartreach-ai/backend:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import sys, time, urllib.request
              for i in range(120):
                  try:
                      urllib.request.urlopen("http://backend:8000/health", timeout=3)
                      print("backend is healthy")
                      sys.exit(0)
                  except Exception:
                      time.sleep(2)
              sys.exit("backend never became healthy")
      containers:
        - name: worker
          image: smartreach-ai/backend:local
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - app.tasks.celery_app
            - worker
            - --loglevel=info
            - --concurrency=2
            - --queues=celery,search,crawl,ai,email
          envFrom:
            - configMapRef:
                name: smartreach-config
            - secretRef:
                name: smartreach-env
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            exec:
              command: ["celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["celery", "-A", "app.tasks.celery_app", "inspect", "ping"]
            periodSeconds: 60
            timeoutSeconds: 10
