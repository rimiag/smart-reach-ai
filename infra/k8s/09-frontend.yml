# SmartReach AI - Next.js frontend (standalone server.js output).
# IMPORTANT: the browser-facing API URL (http://<minikube-ip>:30081) is
# baked into the JS bundle at BUILD time - see README step 2. Changing the
# minikube IP means rebuilding this image.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: smartreach
  labels:
    app: smartreach
    component: frontend
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080        # http://<minikube-ip>:30080
  selector:
    app: smartreach
    component: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smartreach
  labels:
    app: smartreach
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartreach
      component: frontend
  template:
    metadata:
      labels:
        app: smartreach
        component: frontend
    spec:
      containers:
        - name: frontend
          image: smartreach-ai/frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 30
