apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The shared base: environment-neutral manifests. Images are intentionally
# left as the LOCAL names (smartreach-ai/*:local) - overlays rewrite them:
#   overlays/local   -> keeps local names (laptop minikube, images built into it)
#   overlays/staging -> rewrites to ghcr.io/rimiag/* k8s-sha-* (GitOps, GITOPS.md)
# The __MINIKUBE_IP__ placeholder in 02-configmap.yml is machine-specific:
# bake it in one-time before first local apply (README step 4).
resources:
  - 01-namespace.yml
  - 02-configmap.yml
  - 03-mysql.yml
  - 04-redis.yml
  - 05-backend.yml
  - 06-worker.yml
  - 07-scheduler.yml
  - 08-flower.yml
  - 09-frontend.yml
