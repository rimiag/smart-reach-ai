# SmartReach AI - Redis (Celery broker + result backend + cache).
# In-cluster on the standard 6379 (the 6381 in docker-compose existed only
# to avoid colliding with a host redis on the staging VM - no such concern
# inside the cluster; all *_URL values in the ConfigMap use 6379).
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: smartreach
  labels:
    app: smartreach
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: smartreach
    component: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: smartreach
  labels:
    app: smartreach
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartreach
      component: redis
  template:
    metadata:
      labels:
        app: smartreach
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 30
